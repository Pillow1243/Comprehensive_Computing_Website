services:
  web:
    image: python:3.12-alpine
    working_dir: /site
    volumes: [./:/site]
    command: python -m http.server 8080 --bind 0.0.0.0 --directory apps/web
    ports: ["8080:8080"]
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    ports: ["8000:8000"]
    environment: [DATABASE_URL=postgresql://se:se@db:5432/solveeverything, REDIS_URL=redis://redis:6379/0]
    depends_on: [db, redis]
  db:
    image: postgres:16-alpine
    environment: [POSTGRES_DB=solveeverything, POSTGRES_USER=se, POSTGRES_PASSWORD=se]
    volumes: [pgdata:/var/lib/postgresql/data, ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql]
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes: {pgdata: {}}
