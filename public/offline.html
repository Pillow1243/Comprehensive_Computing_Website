<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />

    <meta name="theme-color" content="#000000" />
    <title>آفلاین — SolveEverything</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #000;
        color: #e4e1e6;
        font-family: Vazirmatn, Inter, system-ui, -apple-system, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 420px;
        border: 1px solid #46464f;
        background: #121216;
        border-radius: 24px;
        padding: 32px 24px;
      }
      .logo {
        width: 64px; height: 64px; margin: 0 auto 20px;
        display: grid; place-items: center;
        border-radius: 20px;
        background: linear-gradient(135deg, #4a5cff, #7c5cff);
        font-size: 34px; font-weight: 700; color: #fff;
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.7; color: #c7c5d0; margin: 0 0 20px; }
      a {
        display: inline-block;
        min-height: 48px;
        padding: 0 24px;
        line-height: 48px;
        border-radius: 999px;
        background: #bac3ff;
        color: #0a1a8c;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">∑</div>
      <h1>آفلاین هستید</h1>
      <p>
        محاسبات پایه و فرمول‌های ذخیره‌شده در حافظه پنهان هنوز در دسترس‌اند.
        پس از برقراری اتصال، همه‌چیز به‌روزرسانی می‌شود.
        <br /><span dir="ltr">You are offline. Cached formulas still work.</span>
      </p>
      <a href="./">تلاش دوباره / Retry</a>
    </main>
  </body>
</html>
