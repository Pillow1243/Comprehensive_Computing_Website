name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-web:
    name: Registry, unit, build and E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Audit npm dependencies
        run: npm run audit
      - name: Validate formula registry and catalog
        run: npm run validate-registry
      - name: Unit tests
        run: npm test
      - name: JavaScript syntax checks
        run: for f in apps/web/*.js; do node --check "$f"; done
      - name: Build static export
        run: npm run build
      - name: Enforce JavaScript bundle budget
        run: npm run budget
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E (desktop + Android device matrix)
        id: e2e
        continue-on-error: true
        run: npm run test:e2e:ci
      - name: Summarise E2E results
        if: always()
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report
        run: node scripts/summarise-e2e.mjs e2e-results.json
      - name: Fail when E2E failed
        if: steps.e2e.outcome == 'failure'
        run: exit 1
      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  api:
    name: FastAPI smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r backend/requirements.txt httpx
      - name: API parser/security unit tests
        run: python -m unittest discover -s backend -p 'test_*.py'
      - name: Start API and smoke test
        run: |
          uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/solveeverything-api.log 2>&1 &
          echo $! > /tmp/solveeverything-api.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -f -X POST http://127.0.0.1:8000/api/v1/solve \
            -H 'content-type: application/json' \
            -d '{"formula_id":"ph","inputs":{"concentration":0.001}}'
          curl -f -X OPTIONS http://127.0.0.1:8000/api/v1/solve \
            -H 'Origin: https://pillow1243.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            -o /dev/null -D - | grep -qi 'access-control-allow-origin: https://pillow1243.github.io'

